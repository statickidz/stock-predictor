name: Bug report
description: Report a reproducible problem with Stock Predictor.
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow SECURITY.md. Remove tokens, private paths, and other sensitive details from logs."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the asset, model, and forecast horizon if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit or version, operating system, Python version, browser, and CPU/GPU setup.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Optional sanitized error output or screenshots.
