name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Cache exported models and prior market snapshots
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/browser-models
            .cache/pages-history
          key: pages-${{ runner.os }}-${{ hashFiles('scripts/export_browser.py', 'vendor/kronos/model/*.py') }}-${{ github.run_id }}
          restore-keys: |
            pages-${{ runner.os }}-${{ hashFiles('scripts/export_browser.py', 'vendor/kronos/model/*.py') }}-
            pages-${{ runner.os }}-
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-torch.txt
          python -m pip install -r requirements.txt -r requirements-browser.txt -r requirements-dev.txt
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify and build static site
        run: |
          node --test tests/*.test.mjs
          python -m pytest -q
          python scripts/build_pages.py
      - name: Verify the static artifact in Chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          python scripts/serve_browser.py --port 8020 --base-path /stock-predictor/ > /tmp/pages-preview.log 2>&1 &
          node tests/browser-smoke.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
