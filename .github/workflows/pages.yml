name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_models:
        description: 'Force model preparation (missing or invalid assets rebuild automatically)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  models:
    name: Prepared model assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore prepared exports
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/browser-models
          key: browser-models-v3-${{ hashFiles('tools/model-export/**', 'data/models.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: browser-models-v3-${{ hashFiles('tools/model-export/**', 'data/models.json') }}-
      - name: Validate prepared assets
        id: models
        continue-on-error: true
        run: node scripts/check-models.mjs
      - name: Model-export Python environment
        if: steps.models.outcome == 'failure' || inputs.prepare_models
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Prepare missing or invalid models
        if: steps.models.outcome == 'failure' || inputs.prepare_models
        run: |
          python -m pip install -r tools/model-export/requirements-torch.txt
          python -m pip install -r tools/model-export/requirements.txt
          for model in mini small base; do
            python tools/model-export/export.py --model "$model"
          done
          node scripts/check-models.mjs
      - name: Save prepared exports
        if: steps.models.outcome == 'failure' || inputs.prepare_models
        uses: actions/cache/save@v4
        with:
          path: .cache/browser-models
          key: browser-models-v3-${{ hashFiles('tools/model-export/**', 'data/models.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-models
          path: .cache/browser-models
          include-hidden-files: true
          retention-days: 1

  build:
    name: Astro website / Node 24
    needs: models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: prepared-models
          path: .cache/browser-models
      - uses: actions/cache@v4
        with:
          path: .cache/pages-history
          key: market-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: market-v2-${{ runner.os }}-
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - uses: actions/configure-pages@v5
        id: pages
      - name: Refresh market snapshots using Node
        run: pnpm assets:prepare
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}
          PUBLIC_MARKET_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/market-data/data
      - name: Verify Astro artifact in Chromium
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}
          PUBLIC_MARKET_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/market-data/data
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm preview --port 8020 > /tmp/pages-preview.log 2>&1 &
          SMOKE_URL="http://127.0.0.1:8020${BASE_PATH}" pnpm test:browser
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
