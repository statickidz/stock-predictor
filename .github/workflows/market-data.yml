name: Market data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * 1-5'
      timezone: America/New_York
    - cron: '30 6 * * *'

permissions:
  contents: read

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore published data or initialize isolated branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin market-data; then
            git fetch origin market-data
            git worktree add -b publish-market-data .cache/market-branch FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git worktree add --orphan -b publish-market-data .cache/market-branch
          fi
      - name: Refresh validated snapshots without models
        run: node scripts/refresh-market.mjs .cache/market-branch/data
      - name: Publish snapshots
        shell: bash
        run: |
          cd .cache/market-branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update market snapshots'
          git -C ../.. push origin publish-market-data:market-data
